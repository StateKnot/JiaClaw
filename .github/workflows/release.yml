name: Release qualification
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'scripts/package_release.py'
      - 'tests/installer.py'
      - 'tests/e2e.py'
      - 'tests/mcp.py'
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Four native toolchains run tests and optimized builds from a cold checkout.
    # This job budget does not change any application or fixture deadline.
    timeout-minutes: 40
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Resolve candidate version and validate release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,os,sys; packages=json.load(sys.stdin)["packages"]; tag="v"+next(p["version"] for p in packages if p["name"] == "jiaclaw-host"); assert os.environ["EVENT_NAME"] == "pull_request" or os.environ["REF_NAME"] == tag; f=open(os.environ["GITHUB_ENV"],"a"); f.write("RELEASE_TAG="+tag+"\n"); f.close()'
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target "$TARGET" -p jiaclaw-host
      - name: Verify optimized binary
        run: |
          "target/$TARGET/release/jiaclaw" version
          python3 tests/e2e.py "target/$TARGET/release/jiaclaw"
          python3 tests/mcp.py "target/$TARGET/release/jiaclaw"
      - name: Package and install the exact release archive
        run: |
          mkdir dist
          python3 scripts/package_release.py "target/$TARGET/release/jiaclaw" "dist/jiaclaw-$RELEASE_TAG-$TARGET.tar.gz"
          python3 tests/installer.py "target/$TARGET/release/jiaclaw" --archive "dist/jiaclaw-$RELEASE_TAG-$TARGET.tar.gz" --evidence "dist/$TARGET.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  draft:
    # Pull requests only qualify candidates; no write token or Release mutation.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksummed draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" *.tar.gz SHA256SUMS --draft --verify-tag --title "JiaClaw $RELEASE_TAG" --notes 'Native Linux/macOS binaries. Verify SHA256SUMS before installing. Production gateway and StateKnot qualification remain separate release gates; see repository documentation.'
