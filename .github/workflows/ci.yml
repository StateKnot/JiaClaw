name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    # A macOS run passed every mandatory suite but was cancelled at the 30m boundary.
    # Reserve bounded job capacity for compilation, all suites and runner teardown.
    # Fixture and production deadlines remain independent and unchanged.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install locked toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious
      - run: cargo build --locked -p jiaclaw-host
      - run: python3 tests/e2e.py target/debug/jiaclaw
      - run: python3 tests/mcp.py target/debug/jiaclaw
      - run: python3 tests/native_tools.py target/debug/jiaclaw
      - run: python3 tests/workspace_files.py target/debug/jiaclaw
      - run: python3 tests/file_search.py target/debug/jiaclaw
      - run: python3 tests/workspace_mutations.py target/debug/jiaclaw
      - run: python3 tests/workspace_copy.py target/debug/jiaclaw
      - run: python3 tests/filesystem_info.py target/debug/jiaclaw
      - run: python3 tests/memory_io.py target/debug/jiaclaw
      - run: python3 tests/semantic_memory.py target/debug/jiaclaw
      - run: python3 tests/model_routing.py target/debug/jiaclaw
      - run: python3 tests/model_calls.py target/debug/jiaclaw
      - run: python3 tests/user_gateway.py target/debug/jiaclaw
      - run: python3 tests/read_only_keys.py target/debug/jiaclaw
      - run: python3 tests/gateway_audit.py target/debug/jiaclaw
      - run: python3 tests/tenant_cron.py target/debug/jiaclaw
      - run: python3 tests/tenant_telegram.py target/debug/jiaclaw
      - run: python3 tests/tenant_slack.py target/debug/jiaclaw
      - run: python3 tests/scheduler.py target/debug/jiaclaw
      - name: Select OpenSSL 3 for channel signature fixtures
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: python3 tests/tenant_discord.py target/debug/jiaclaw
      - run: python3 tests/tenant_feishu.py target/debug/jiaclaw
      - run: python3 tests/tenant_wecom.py target/debug/jiaclaw
      - run: python3 tests/channels.py target/debug/jiaclaw
      - run: python3 tests/scheduled_delivery.py target/debug/jiaclaw
      - run: python3 tests/discord_scheduled.py target/debug/jiaclaw
      - run: python3 tests/feishu.py target/debug/jiaclaw
      - run: python3 tests/wecom.py target/debug/jiaclaw
      - run: python3 tests/wecom_startup.py target/debug/jiaclaw
      - run: python3 tests/dingtalk.py target/debug/jiaclaw
      - run: python3 tests/installer.py target/debug/jiaclaw
      - name: Browser acceptance
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/jiaclaw-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/jiaclaw-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/jiaclaw-browser/node_modules" node tests/browser.cjs target/debug/jiaclaw
          NODE_PATH="$RUNNER_TEMP/jiaclaw-browser/node_modules" node tests/outbox_browser.cjs target/debug/jiaclaw
          NODE_PATH="$RUNNER_TEMP/jiaclaw-browser/node_modules" node tests/scheduler_browser.cjs target/debug/jiaclaw
          NODE_PATH="$RUNNER_TEMP/jiaclaw-browser/node_modules" node tests/read_only_browser.cjs target/debug/jiaclaw
      - name: Real container sandbox acceptance
        if: runner.os == 'Linux'
        env:
          JIACLAW_TEST_DOCKER: /usr/bin/docker
          JIACLAW_TEST_EXEC_IMAGE: alpine@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
        run: |
          docker pull "$JIACLAW_TEST_EXEC_IMAGE"
          cargo test -p jiaclaw real_container --locked -- --ignored
          test -z "$(docker ps -aq --filter label=jiaclaw.sandbox=true)"
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag jiaclaw:ci .
      - name: Image startup as non-root with read-only root filesystem
        run: python3 tests/container.py jiaclaw:ci
      - name: Isolated user gateway with bounded persistent volumes
        run: python3 tests/gateway_container.py jiaclaw:ci
