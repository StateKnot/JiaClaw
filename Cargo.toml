[workspace]
members = [
    "crates/jiaclaw",
    "crates/jiaclaw-core",
    "crates/jiaclaw-host",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["JiaClaw contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jiawenyao401/JiaClaw"
homepage = "https://github.com/jiawenyao401/JiaClaw"

[workspace.dependencies]
# StateKnot 0.1.0-alpha.1 is published and requires Rust 1.88+.
# Its production qualification is still pending. The current application does
# not link the runtime; see docs/stateknot-gaps.md for the integration gates.

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client - using minreq for simplicity and Rust 1.83 compatibility
minreq = { version = "2.12", features = ["json-using-serde", "https"] }

# Utilities
dirs = "4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"
toml = "=0.5.11"
indexmap = "=2.7.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI - using version compatible with Rust 1.83 / edition 2021
clap = { version = "=4.4.18", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
