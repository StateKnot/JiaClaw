[package]
name = "jiaclaw"
description = "Personal durable agent runtime built on StateKnot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
jiaclaw-core = { version = "=0.1.0", path = "../jiaclaw-core" }

stateknot-integrations = { workspace = true }
jsonschema = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
minreq = { workspace = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tracing = { workspace = true }
uuid = { version = "=1.26.1", features = ["v4"] }
async-trait = "0.1"
indexmap = { workspace = true }
libc = "0.2"
cap-std = "=3.4.5"
fs2 = "=0.4.3"

[dev-dependencies]
tempfile = "=3.16.0"
mockito = "0.31"

[lints]
workspace = true
