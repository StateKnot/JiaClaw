[package]
name = "jiaclaw-host"
description = "JiaClaw executable host binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "jiaclaw"
path = "src/main.rs"

[dependencies]
jiaclaw = { version = "=0.1.0", path = "../jiaclaw" }
jiaclaw-core = { version = "=0.1.0", path = "../jiaclaw-core" }

# StateKnot integration gates: docs/stateknot-gaps.md

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }

# HTTP server dependencies
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "=1.26.1", features = ["v4"] }
governor = "0.6"
minreq = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
# Ed25519 for Discord Interactions (ring 0.17 stays on Rust 1.83; ed25519-dalek 2.2 pulls edition2024 crates)
ring = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fs2 = "=0.4.3"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
