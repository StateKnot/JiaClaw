<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JiaClaw · 工作台</title><link rel="stylesheet" href="/ui/app.css"><script src="/ui/app.js" defer></script>
</head>
<body>
<header><a class="brand" href="/">JiaClaw<span>个人 Agent 工作台</span></a><form id="connect-form"><label for="api-token">API Token</label><input id="api-token" type="password" autocomplete="off" placeholder="输入服务的 API Token"><button type="submit">连接</button></form></header>
<div class="workspace"><aside aria-label="会话管理"><div class="aside-head"><h1>会话</h1><button id="new-session" disabled>＋ 新建</button></div><button id="refresh" class="subtle" disabled>刷新列表</button><div id="workspace-tabs" hidden><button id="chat-tab" class="subtle" aria-pressed="true">会话</button><button id="jobs-tab" class="subtle" aria-pressed="false">定时任务</button></div><nav id="sessions" aria-label="会话列表"></nav><p class="aside-note">会话由服务器保存。密钥仅留在当前页面内存中，关闭页面后清除。</p></aside>
<main><p id="status" role="status" aria-live="polite">输入 API Token 并连接。未设置鉴权的本机服务可直接连接。</p><div id="chat-view"><div class="conversation-head"><div><p class="eyebrow">WORKSPACE</p><h2 id="session-title">开始一段对话</h2></div><button id="delete-session" class="subtle danger" disabled>删除会话</button></div><section id="messages" aria-label="对话消息" aria-live="polite"><div class="welcome"><h3>让想法成为行动。</h3><p>连接服务后，选择已有会话或创建新会话。可用工具由服务配置决定。</p></div></section><form id="chat-form"><label for="message">消息</label><textarea id="message" rows="3" placeholder="输入消息… Ctrl / ⌘ + Enter 发送" required disabled maxlength="65536"></textarea><div class="composer-bottom"><span>回复完成后显示；支持工具调用。</span><button id="send" type="submit" disabled>发送 ↑</button></div></form></div><section id="jobs-view" hidden aria-label="定时任务管理">
<div class="conversation-head"><div><p class="eyebrow">SCHEDULE</p><h2>定时任务</h2></div><button id="jobs-refresh" class="subtle">刷新任务</button></div>
<p class="jobs-note">任务在服务端定时运行，可能产生模型费用。结果保存在这里；暂停与删除阻止后续运行，已提交的运行可能继续。</p>
<details id="job-create"><summary>＋ 新建任务</summary><form id="job-form">
<label>名称<input id="job-name" required maxlength="128" placeholder="例如：每日计划"></label>
<label>任务内容<textarea id="job-prompt" rows="3" required maxlength="32768" placeholder="明确说明任务目标与需要的结果"></textarea></label>
<div class="job-fields"><label>时间规则<select id="job-kind"><option value="interval">固定间隔</option><option value="cron">Cron 时间表</option></select></label><label id="job-interval-field">间隔（秒）<input id="job-interval" type="number" min="1" max="31536000" value="3600" required></label></div>
<div id="job-cron-fields" class="job-fields" hidden><label>Cron（五段）<input id="job-cron" value="0 9 * * *" maxlength="128"></label><label>IANA 时区<input id="job-timezone" value="Asia/Shanghai" maxlength="128"></label></div>
<div class="job-fields"><label>最长运行时间（秒）<input id="job-timeout" type="number" min="1" max="120" value="120" required></label><fieldset><legend>允许的工具（至少一项）</legend><label><input id="job-clock" type="checkbox" checked>读取当前时间</label><label><input id="job-json" type="checkbox">查询 JSON</label></fieldset></div>
<button id="job-submit" type="submit">创建并启用</button></form></details>
<div class="jobs-toolbar"><label><input id="jobs-deleted" type="checkbox">显示已删除任务</label><span id="jobs-count"></span></div>
<div id="jobs-list" aria-label="任务列表"></div><div class="pager"><button id="jobs-prev" class="subtle">上一页</button><button id="jobs-next" class="subtle">下一页</button></div>
<section id="job-detail" hidden aria-label="任务详情"><h3 id="job-title"></h3><p id="job-summary"></p><pre id="job-detail-prompt"></pre><div class="job-actions"><button id="job-toggle">暂停任务</button><button id="job-delete" class="subtle danger">删除任务</button><button id="runs-refresh" class="subtle">刷新运行结果</button></div><div id="job-runs" aria-label="运行结果"></div><div class="pager"><button id="runs-prev" class="subtle">上一页结果</button><button id="runs-next" class="subtle">下一页结果</button></div></section>
</section></main></div>
</body></html>
