<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JiaClaw · 工作台</title><link rel="stylesheet" href="/ui/app.css"><script src="/ui/app.js" defer></script>
</head>
<body>
<header><a class="brand" href="/">JiaClaw<span>个人 Agent 工作台</span></a><form id="connect-form"><label for="api-token">API Token</label><input id="api-token" type="password" autocomplete="off" placeholder="输入服务的 API Token"><button type="submit">连接</button></form></header>
<div class="workspace"><aside aria-label="会话管理"><div class="aside-head"><h1>会话</h1><button id="new-session" disabled>＋ 新建</button></div><button id="refresh" class="subtle" disabled>刷新列表</button><nav id="sessions" aria-label="会话列表"></nav><p class="aside-note">会话由服务器保存。密钥仅留在当前页面内存中，关闭页面后清除。</p></aside>
<main><div class="conversation-head"><div><p class="eyebrow">WORKSPACE</p><h2 id="session-title">开始一段对话</h2></div><button id="delete-session" class="subtle danger" disabled>删除会话</button></div><p id="status" role="status" aria-live="polite">输入 API Token 并连接。未设置鉴权的本机服务可直接连接。</p><section id="messages" aria-label="对话消息" aria-live="polite"><div class="welcome"><h3>让想法成为行动。</h3><p>连接服务后，选择已有会话或创建新会话。可用工具由服务配置决定。</p></div></section><form id="chat-form"><label for="message">消息</label><textarea id="message" rows="3" placeholder="输入消息… Ctrl / ⌘ + Enter 发送" required disabled maxlength="65536"></textarea><div class="composer-bottom"><span>回复完成后显示；支持工具调用。</span><button id="send" type="submit" disabled>发送 ↑</button></div></form></main></div>
</body></html>
